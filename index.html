<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#000;
    overflow:hidden;
}

/* VIDEO */
.live-box{
    position:relative;
    width:100%;
    height:100vh;
}

video{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* TOP */
.top{
    position:absolute;
    top:15px;
    left:15px;
    right:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    z-index:20;
}

.profile{
    display:flex;
    align-items:center;
    gap:10px;
}

/* FOTO PROFIL */
.profile img{
    width:45px;
    height:45px;
    border-radius:50%;
    object-fit:cover;
    border:2px solid #ff2d75;
}

.name{
    color:white;
    font-size:15px;
    font-weight:bold;
}

.live-badge{
    background:#ff004f;
    color:white;
    padding:5px 10px;
    border-radius:6px;
    font-size:12px;
    font-weight:bold;
    margin-left:8px;
}

.viewer{
    color:white;
    font-size:13px;
    background:rgba(0,0,0,0.4);
    padding:6px 12px;
    border-radius:20px;
    backdrop-filter:blur(5px);
}

/* COMMENTS */
.comments{
    position:absolute;
    left:15px;
    bottom:90px;
    width:75%;
    z-index:20;
}

.comment{
    color:white;
    margin-top:12px;
    font-size:14px;
    line-height:1.4;
    animation:fadeUp 0.4s ease;
    text-shadow:0 0 5px rgba(0,0,0,0.8);
}

.comment b{
    color:#fff;
}

@keyframes fadeUp{
    from{
        transform:translateY(10px);
        opacity:0;
    }
    to{
        transform:translateY(0);
        opacity:1;
    }
}

/* BOTTOM */
.bottom{
    position:absolute;
    bottom:20px;
    left:15px;
    right:15px;
    display:flex;
    align-items:center;
    gap:10px;
    z-index:20;
}

.input{
    flex:1;
    background:rgba(255,255,255,0.15);
    border:1px solid rgba(255,255,255,0.2);
    color:white;
    padding:13px 18px;
    border-radius:40px;
    backdrop-filter:blur(8px);
    font-size:14px;
}

.actions{
    display:flex;
    gap:15px;
    color:white;
    font-size:24px;
}

/* FLOAT HEART */
.heart{
    position:absolute;
    right:20px;
    bottom:80px;
    color:#ff2d75;
    font-size:26px;
    animation:floatHeart 3s linear forwards;
    opacity:0;
    z-index:30;
}

@keyframes floatHeart{

    0%{
        transform:translateY(0) scale(1);
        opacity:1;
    }

    100%{
        transform:translateY(-300px) scale(1.8);
        opacity:0;
    }

}

</style>
</head>

<body>

<!-- IKLAN -->
<script src="https://rungbeacon.com/ac/cd/19/accd19456467f32573107aa43783b50a.js"></script>

<div class="live-box">

    <!-- VIDEO -->
    <video autoplay muted loop playsinline>
        <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
    </video>

    <!-- TOP -->
    <div class="top">

        <!-- PROFILE -->
        <div class="profile">

            <!-- FOTO PROFIL -->
            <img src="./109268.jpg">

            <div>

                <span class="name">
                    @auroralive
                </span>

                <span class="live-badge">
                    LIVE
                </span>

            </div>

        </div>

        <!-- VIEWER -->
        <div class="viewer">
            👁 12.8K
        </div>

    </div>

    <!-- COMMENTS -->
    <div class="comments" id="comments"></div>

    <!-- BOTTOM -->
    <div class="bottom">

        <div class="input">
            Add a comment...
        </div>

        <div class="actions">
            ❤️ 
        </div>

    </div>

</div>

<script>

/* RANDOM COMMENTS */

const users = [
    "Emily",
    "Sophia",
    "Daniel",
    "Olivia",
    "Michael",
    "Charlotte",
    "Lucas",
    "Amelia"
];

const texts = [
    "wow this live is amazing 🔥",
    "hello from indonesia 🇮🇩",
    "you look beautiful 😍",
    "best live tonight ❤️",
    "can't stop watching 👀",
    "this is crazy 🔥🔥",
    "omg wowww",
    "love this stream ❤️"
];

function createComment(){

    const commentBox =
        document.getElementById("comments");

    const div =
        document.createElement("div");

    div.classList.add("comment");

    const randomUser =
        users[Math.floor(Math.random()*users.length)];

    const randomText =
        texts[Math.floor(Math.random()*texts.length)];

    div.innerHTML =
        "<b>"+randomUser+"</b> "+randomText;

    commentBox.appendChild(div);

    if(commentBox.children.length > 6){
        commentBox.removeChild(commentBox.children[0]);
    }

}

/* AUTO COMMENT */
setInterval(createComment,2000);

/* FLOAT HEART */

function createHeart(){

    const heart =
        document.createElement("div");

    heart.classList.add("heart");

    heart.innerHTML = "❤️";

    heart.style.right =
        (20 + Math.random()*30)+"px";

    document.body.appendChild(heart);

    setTimeout(()=>{
        heart.remove();
    },3000);

}

/* AUTO HEART */
setInterval(createHeart,600);

</script>

</body>
</html>
